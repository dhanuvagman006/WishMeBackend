name: Deploy

# Manual, gated deploy of an already-built image to the VPS. Configure the `production` environment in GitHub with
# required reviewers and these secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (a deploy-only key), VPS_KNOWN_HOSTS.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (commit SHA) to deploy
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[a-f0-9]{7,40}$|^v[0-9.]+$ ]] || { echo "invalid tag"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" "/opt/wishme/scripts/deploy.sh $TAG"
